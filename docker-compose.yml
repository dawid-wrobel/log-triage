services:
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  agent:
    build: .
    depends_on: [ollama]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    volumes: [.:/app]
volumes:
  ollama: